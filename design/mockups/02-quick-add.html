<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chindi — Quick add</title>
<style>@font-face{font-family:'Bricolage Grotesque';font-weight:600;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:500;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:600;src:url(fonts/dm-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}</style>
</head>
<body>




<style>
body{margin:0}
a{color:#17141F;text-decoration:none}a:hover{color:#000000}
.h{font-family:'Bricolage Grotesque', sans-serif}
.chip{height:36px;padding:0 14px;border-radius:12px;border:1.5px solid #17141F;background:#FFFFFF;font-family:'DM Sans', sans-serif;font-size:13px;font-weight:700;color:#17141F;display:flex;align-items:center;gap:6px;white-space:nowrap}
.on{background:#17141F;color:#FFFFFF}
.key{height:52px;border:1.5px solid #17141F;border-radius:14px;background:#FFFFFF;box-shadow:2px 2px 0 #17141F;font-family:'Bricolage Grotesque', sans-serif;font-size:24px;font-weight:700;color:#17141F}
.dot{width:10px;height:10px;border-radius:5px;border:1.5px solid #17141F;display:inline-block}
.lbl{font-size:12px;font-weight:700;color:#4A4553;margin-bottom:7px}
</style>

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#4A4553;font-family:'DM Sans', system-ui, sans-serif;color:#17141F">

<div style="position:absolute;left:0;right:0;bottom:0;height:776px;background:#FFFBF3;border-top:2px solid #17141F;border-radius:26px 26px 0 0;padding:10px 20px 0;box-sizing:border-box;display:flex;flex-direction:column">
<div style="width:40px;height:5px;border-radius:3px;background:#17141F;opacity:0.25;margin:0 auto 10px"></div>

<div style="display:flex;justify-content:space-between;align-items:center">
<a href="01-home.html" aria-label="Close" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div class="h" style="font-size:17px;font-weight:800">New expense</div>
<div style="width:34px"></div>
</div>

<button class="chip" style="align-self:center;margin-top:4px;background:#CDE3FF">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 8H6.5"/></svg>
Groceries · $142 left
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>

<div style="text-align:center;margin-top:10px">
<div class="h" style="font-size:58px;font-weight:800;letter-spacing:-2px;line-height:1.1">$24.60</div>
<div style="font-size:13px;font-weight:600;color:#4A4553">Leaves $117.40 in Groceries</div>
</div>

<div style="margin-top:14px">
<div class="lbl">Where</div>
<div style="display:flex;gap:8px;overflow:hidden">
<button class="chip on">Costco</button>
<button class="chip">Corner Market</button>
<button class="chip">Farmers market</button>
</div>
</div>

<div style="margin-top:12px">
<div class="lbl">Paid with</div>
<div style="display:flex;gap:8px">
<button class="chip on">Debit</button>
<button class="chip">Visa</button>
<button class="chip">Cash</button>
</div>
</div>

<div style="margin-top:12px">
<div class="lbl">How does it feel? <span style="font-weight:500">(optional)</span></div>
<div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px">
<button class="chip" style="justify-content:center;padding:0 4px"><span class="dot" style="background:#FF8FB1"></span>Love</button>
<button class="chip" style="justify-content:center;padding:0 4px;background:#FFC93C;box-shadow:2px 2px 0 #17141F"><span class="dot" style="background:#8EC5FF"></span>Good</button>
<button class="chip" style="justify-content:center;padding:0 4px"><span class="dot" style="background:#D9D2C3"></span>Meh</button>
<button class="chip" style="justify-content:center;padding:0 4px"><span class="dot" style="background:#F2542D"></span>Regret</button>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;margin-top:16px">
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">.</button><button class="key">0</button>
<button class="key" aria-label="Delete digit" style="display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12zM13 10l4 4M17 10l-4 4"/></svg></button>
</div>

<a href="01-home.html" class="h" style="margin-top:14px;height:56px;border-radius:16px;background:#FFC93C;border:2px solid #17141F;box-shadow:3px 3px 0 #17141F;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800">Add $24.60</a>
</div>
</div>


</body>
</html>
