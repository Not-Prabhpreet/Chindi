<div class="h" style="font-size:30px;font-weight:800;letter-spacing:-0.8px">Wishlist</div>
<div style="font-size:14px;font-weight:500;color:#4A4553;margin-top:2px">Want it? Sleep on it. A few times.</div>
</div>

<div style="margin:14px 16px 0;border-radius:20px;background:#FFC93C;border:2px solid #17141F;box-shadow:4px 4px 0 #17141F;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
<div>
<div style="font-size:12px;font-weight:700">Money not wasted</div>
<div class="h" style="font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1">$346</div>
<div style="font-size:12px;font-weight:600">6 things you let go this year</div>
</div>
<button style="height:42px;padding:0 14px;border-radius:12px;border:2px solid #17141F;background:#17141F;color:#FFFFFF;font-family:inherit;font-size:13px;font-weight:700">Move to a jar</button>
</div>

<div class="h" style="font-size:17px;font-weight:800;margin:22px 20px 8px">Ready to decide</div>
<div style="padding:0 16px">
<div class="card" style="background:#FFD1DE">
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div>
<div class="h" style="font-size:18px;font-weight:800">Running jacket</div>
<div style="font-size:12px;font-weight:600;color:#4A4553;margin-top:1px">Added Oct 15 · waited 30 days</div>
</div>
<div class="h" style="font-size:20px;font-weight:800">$180</div>
</div>
<div style="font-size:13px;font-weight:600;margin-top:6px">Past you said: "for winter runs"</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;margin-top:10px">
<button style="height:44px;border-radius:12px;border:1.5px solid #17141F;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:700;color:#17141F">Still want it</button>
<button style="height:44px;border-radius:12px;border:2px solid #17141F;background:#FFC93C;box-shadow:2px 2px 0 #17141F;font-family:inherit;font-size:14px;font-weight:700;color:#17141F">Let it go · +$180</button>
</div>
</div>
</div>

<div class="h" style="font-size:17px;font-weight:800;margin:22px 20px 8px">Waiting it out</div>
<div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div><div style="font-size:15px;font-weight:700">Wireless earbuds</div><div style="margin-top:6px"><span class="pill" style="background:#FFE3A3"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>2 days 21 h left</span></div></div>
<div class="h" style="font-size:17px;font-weight:800">$129</div>
</div>
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div><div style="font-size:15px;font-weight:700">Desk lamp</div><div style="margin-top:6px"><span class="pill" style="background:#FFFFFF"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>18 days left</span></div></div>
<div class="h" style="font-size:17px;font-weight:800">$45</div>
</div>
