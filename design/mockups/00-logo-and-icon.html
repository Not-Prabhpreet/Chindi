<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chindi — Logo and icon</title>
<style>@font-face{font-family:'Bricolage Grotesque';font-weight:600;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:500;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:600;src:url(fonts/dm-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'DM Sans';font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}</style>

<body>




<style>
body{margin:0}
a{color:#17141F}a:hover{color:#000000}
.h{font-family:'Bricolage Grotesque', sans-serif}
</style>

<div style="width:1100px;height:460px;box-sizing:border-box;padding:40px 48px;background:#FFFBF3;font-family:'DM Sans', system-ui, sans-serif;color:#17141F">
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div>
<div class="h" style="font-size:30px;font-weight:800;letter-spacing:-0.8px">Logo and app icon</div>
<div style="font-size:14px;font-weight:500;color:#4A4553;margin-top:4px">The side-eye coin: always watching what you spend.</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<svg width="48" height="48" viewBox="0 0 40 40" role="img" aria-label="Side-eye coin logo"><circle cx="20" cy="20" r="17" fill="#FFC93C" stroke="#17141F" stroke-width="2.5"/><path d="M10 16.5h8M22 16.5h8" stroke="#17141F" stroke-width="2.5" stroke-linecap="round"/><circle cx="16.3" cy="19" r="2.2" fill="#17141F"/><circle cx="28.3" cy="19" r="2.2" fill="#17141F"/><path d="M15 27c3 1 7 1 10-1.5" stroke="#17141F" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
<div class="h" style="font-size:40px;font-weight:800;letter-spacing:-1.4px">chindi</div>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:40px;margin-top:30px">

<div>
<div style="display:flex;align-items:flex-end;gap:18px">
<svg width="170" height="170" viewBox="0 0 100 100" role="img" aria-label="Side-eye coin on a near-black background"><rect width="100" height="100" rx="22" fill="#17141F"/><circle cx="50" cy="52" r="32" fill="#FFC93C" stroke="#FFFBF3" stroke-width="3"/><path d="M31 44h15M54 44h15" stroke="#17141F" stroke-width="4.5" stroke-linecap="round"/><circle cx="42" cy="49" r="4.2" fill="#17141F"/><circle cx="65" cy="49" r="4.2" fill="#17141F"/><path d="M40 66c6 2 13 2 20-3" stroke="#17141F" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>
<svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="Small version"><rect width="100" height="100" rx="22" fill="#17141F"/><circle cx="50" cy="52" r="32" fill="#FFC93C" stroke="#FFFBF3" stroke-width="3"/><path d="M31 44h15M54 44h15" stroke="#17141F" stroke-width="4.5" stroke-linecap="round"/><circle cx="42" cy="49" r="4.2" fill="#17141F"/><circle cx="65" cy="49" r="4.2" fill="#17141F"/><path d="M40 66c6 2 13 2 20-3" stroke="#17141F" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>
</div>
<div class="h" style="font-size:18px;font-weight:800;margin-top:14px">A. Night shift</div>
<div style="font-size:13px;font-weight:500;color:#4A4553;margin-top:3px;line-height:1.4">Dark background, glowing coin. Stands out on any wallpaper.</div>
</div>

<div>
<div style="display:flex;align-items:flex-end;gap:18px">
<svg width="170" height="170" viewBox="0 0 100 100" role="img" aria-label="Side-eye coin on bubblegum pink"><rect width="100" height="100" rx="22" fill="#FF8FB1"/><circle cx="50" cy="52" r="32" fill="#FFC93C" stroke="#17141F" stroke-width="4"/><path d="M31 44h15M54 44h15" stroke="#17141F" stroke-width="4.5" stroke-linecap="round"/><circle cx="42" cy="49" r="4.2" fill="#17141F"/><circle cx="65" cy="49" r="4.2" fill="#17141F"/><path d="M40 66c6 2 13 2 20-3" stroke="#17141F" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>
<svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="Small version"><rect width="100" height="100" rx="22" fill="#FF8FB1"/><circle cx="50" cy="52" r="32" fill="#FFC93C" stroke="#17141F" stroke-width="4"/><path d="M31 44h15M54 44h15" stroke="#17141F" stroke-width="4.5" stroke-linecap="round"/><circle cx="42" cy="49" r="4.2" fill="#17141F"/><circle cx="65" cy="49" r="4.2" fill="#17141F"/><path d="M40 66c6 2 13 2 20-3" stroke="#17141F" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>
</div>
<div class="h" style="font-size:18px;font-weight:800;margin-top:14px">B. Bubblegum</div>
<div style="font-size:13px;font-weight:500;color:#4A4553;margin-top:3px;line-height:1.4">The most playful. Matches the app's pink highlights.</div>
</div>

<div>
<div style="display:flex;align-items:flex-end;gap:18px">
<svg width="170" height="170" viewBox="0 0 100 100" role="img" aria-label="Wordmark chindi on mango yellow"><rect width="100" height="100" rx="22" fill="#FFC93C"/><text x="50" y="60" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="26" font-weight="800" letter-spacing="-1" fill="#17141F">chindi</text><path d="M34 70c10 3 22 3 32-1" stroke="#17141F" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
<svg width="60" height="60" viewBox="0 0 100 100" role="img" aria-label="Small version"><rect width="100" height="100" rx="22" fill="#FFC93C"/><text x="50" y="60" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="26" font-weight="800" letter-spacing="-1" fill="#17141F">chindi</text><path d="M34 70c10 3 22 3 32-1" stroke="#17141F" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
</div>
<div class="h" style="font-size:18px;font-weight:800;margin-top:14px">C. Wordmark</div>
<div style="font-size:13px;font-weight:500;color:#4A4553;margin-top:3px;line-height:1.4">Just the name with a smirk. Gets hard to read at small sizes.</div>
</div>

</div>
</div>


</body>
</html>
