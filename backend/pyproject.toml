[project]
name = "chindi-api"
version = "0.1.0"
description = "Chindi API: a manual-entry budgeting PWA that lovingly roasts you."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "PyJWT>=2.10.1",
    "apscheduler>=3.11,<4",
    "pywebpush>=2.0",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=2.2,<3",
]

[tool.uv]
package = false
# Use the installed, signed Python. Smart App Control blocks uv-downloaded interpreters on Windows.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette nudges toward a different HTTP client; httpx still works for TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
