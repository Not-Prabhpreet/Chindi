# Render Blueprint: the whole app on Render.
# - chindi:     static site serving the built PWA; /api/* is proxied to chindi-api,
#               so the browser sees one origin (cookies, passkeys and CORS just work).
# - chindi-api: FastAPI in Docker; runs Alembic migrations on start.
# - chindi-db:  managed Postgres.
services:
  - type: web
    name: chindi-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chindi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://chindi.onrender.com
      - key: CORS_ORIGINS
        value: '["https://chindi.onrender.com"]'
      - key: ALLOW_SIGNUPS
        value: "false"
      - key: DEFAULT_CURRENCY
        value: CAD

  - type: web
    name: chindi
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://chindi-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: chindi-db
    plan: free
    databaseName: chindi
    user: chindi
